version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: masaze_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: trudnehaslo123
      POSTGRES_DB: rezerwacje
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
    container_name: masaze_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=trudnehaslo123
      - DB_NAME=rezerwacje
    depends_on:
      - db

  frontend:
    build: 
      context: ./frontend
    container_name: masaze_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
