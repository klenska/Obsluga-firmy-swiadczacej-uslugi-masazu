<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masu Masu SPA — Projekt A</title>
<style>
:root{--bg:#f5f6f2;--card:#fff;--ink:#23392b;--sub:#6c8072;--line:#dfe9df;--green:#387554;--pale:#eaf5eb;--bad:#ae3f48;--blue:#416ea3;--gold:#a06d29}*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9dc8a7;outline-offset:2px}h1{font-size:26px;margin:0}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:0 0 8px}p{margin:0 0 12px}.muted,small{color:var(--sub)}.layout{min-height:100vh;display:grid;grid-template-columns:232px minmax(0,1fr)}aside{background:#1d392a;color:#e3f0e7;padding:22px 12px}.logo{font-size:20px;font-weight:800;padding:10px 12px 25px}.logo span{color:#a5dbb2}.nav{display:grid;gap:5px}.nav button{text-align:left;background:transparent;border:0;border-radius:9px;color:#d4e5d7;padding:12px}.nav button:hover,.nav button.active{background:#3a6248;color:#fff}main{padding:27px;min-width:0;max-width:1480px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--green);font-weight:700}.grid{display:grid;gap:15px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:21px;min-width:0;box-shadow:0 6px 25px #14371b08}.section{margin-top:20px}.btn{border:0;border-radius:9px;background:var(--green);color:#fff;padding:11px 15px;font-weight:650}.btn.secondary{background:var(--pale);color:var(--green)}.btn.danger{background:#fae9eb;color:var(--bad)}.btn.outline{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.small{font-size:12px;padding:7px 10px}.btn.full{width:100%}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:13px}.field{display:grid;gap:6px;font-size:12px;font-weight:700}.field input,.field select,.field textarea,select.control{width:100%;padding:11px 12px;background:white;color:var(--ink);border:1px solid var(--line);border-radius:9px;min-width:0}.field textarea{min-height:75px;resize:vertical}.price{font-size:24px;font-weight:800}.tag{display:inline-block;border-radius:30px;background:var(--pale);color:var(--green);font-size:11px;font-weight:700;padding:5px 10px}.tag.warn{background:#fff0d9;color:var(--gold)}.tag.bad{background:#fae9eb;color:var(--bad)}.tag.blue{background:#eaf1fc;color:var(--blue)}.metric{font-size:29px;font-weight:800;margin:5px 0}.service{display:flex;flex-direction:column;gap:10px}.service .symbol{font-size:28px}.service .btn{margin-top:auto}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px;text-align:left}th,td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:11px;text-transform:uppercase;color:var(--sub);background:#f6f9f5}tr:last-child td{border:0}.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.slot{padding:11px 3px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}.slot.selected{color:#fff;background:var(--green);border-color:var(--green)}.slot:disabled{text-decoration:line-through;background:#f1f1f1}.info{border-radius:10px;background:#edf4ff;color:var(--blue);padding:12px;font-size:13px}.error{border-radius:10px;background:#fdeced;color:var(--bad);padding:12px;font-size:13px}.good{border-radius:10px;background:var(--pale);color:var(--green);padding:12px;font-size:13px}.hidden{display:none!important}.divider{height:1px;background:var(--line);margin:15px 0}.modal-layer{position:fixed;inset:0;background:#122019b0;z-index:20;display:grid;place-items:center;padding:15px}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:17px;background:white;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.toast{position:fixed;bottom:20px;right:20px;padding:13px 17px;border-radius:10px;background:#1d392a;color:white;max-width:400px;z-index:30}.code{background:#182b21;color:#b8ecc6;padding:15px;border-radius:12px;white-space:pre-wrap;word-break:break-word;max-height:390px;overflow:auto;font:12px/1.6 Consolas,monospace}.empty{text-align:center;color:var(--sub);padding:30px 12px}.bar{height:11px;background:#e7eee6;border-radius:10px;overflow:hidden}.bar b{display:block;height:100%;background:var(--green)}.chartrow{display:grid;grid-template-columns:135px 1fr 30px;gap:9px;align-items:center;margin:12px 0}.hint{font-size:12px;color:var(--sub)}@media(max-width:1000px){.four,.three{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.layout{display:block}aside{padding:10px}.logo{padding:8px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}main{padding:17px 12px}.two,.three,.four{grid-template-columns:1fr}.slots{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:16px}.chartrow{grid-template-columns:95px 1fr 25px}} 
</style>
</head>
<body>
<div class="layout">
<aside><div class="logo">✿ Masu Masu <span>SPA</span></div><nav class="nav" id="nav">
<button data-page="dashboard" class="active">◫ Pulpit</button><button data-page="services">✿ Usługi</button><button data-page="booking">▦ Nowa rezerwacja</button><button data-page="reservations">☷ Rezerwacje</button><button data-page="employees">♙ Pracownicy</button><button data-page="rooms">⌂ Gabinety</button><button data-page="clients">♧ Klienci</button><button data-page="reports">▥ Raporty</button><button data-page="integrations">⇄ Integracje API</button>
</nav><p class="hint" style="color:#bad4c1;margin:22px 10px">Projekt A · demonstracja frontendowa</p></aside>
<main><div class="top"><div><div class="eyebrow">Projekt A / zarządzanie salonem masażu</div><h1 id="pageTitle">Pulpit</h1></div><span class="tag">● Demo lokalne</span></div><div id="app"></div></main>
</div>
<div id="modalLayer" class="modal-layer hidden" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><h2 id="modalTitle"></h2><button class="btn outline small" onclick="closeModal()" aria-label="Zamknij">✕</button></div><div id="modalBody"></div></div></div>
<div class="toast hidden" id="toast" role="status"></div>
<script>
'use strict';
// Frontend demonstracyjny: dane lokalne, integracje API symulowane.
const KEY='masu-masu-project-a-frontend-v2';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const dateISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDay=n=>{const d=new Date();d.setDate(d.getDate()+n);return dateISO(d)};
const fmt=n=>Number(n||0).toLocaleString('pl-PL',{style:'currency',currency:'PLN'});
const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const clock=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const intersect=(a,b,c,d)=>a<d&&c<b;
const selectOptions=(list,placeholder='Wybierz',value='')=>`<option value="">${esc(placeholder)}</option>`+list.map(x=>`<option value="${esc(x.id)}" ${x.id===value?'selected':''}>${esc(x.name)}</option>`).join('');
function seed(){return {
 services:[
 {id:'s1',name:'Masaż relaksacyjny',duration:60,price:180,icon:'🌿',description:'Delikatny masaż, który redukuje stres i napięcie.',therapists:['e1','e2'],rooms:['r1','r3']},
 {id:'s2',name:'Masaż klasyczny',duration:45,price:150,icon:'💆',description:'Tradycyjny masaż poprawiający samopoczucie.',therapists:['e1','e3'],rooms:['r1','r2']},
 {id:'s3',name:'Masaż sportowy',duration:60,price:210,icon:'⚡',description:'Regeneracja mięśni po wysiłku.',therapists:['e3'],rooms:['r2']},
 {id:'s4',name:'Masaż gorącymi kamieniami',duration:90,price:260,icon:'🔥',description:'Relaks z użyciem rozgrzanych kamieni.',therapists:['e2'],rooms:['r3']},
 {id:'s5',name:'Masaż pleców i karku',duration:30,price:110,icon:'✨',description:'Rozluźnienie pleców, barków i szyi.',therapists:['e1','e2','e3'],rooms:['r1','r2']},
 {id:'s6',name:'Masaż aromaterapeutyczny',duration:60,price:190,icon:'🌸',description:'Masaż z użyciem aromatycznych olejków.',therapists:['e1','e2'],rooms:['r1','r3']}],
 employees:[
 {id:'e1',name:'Anna Kowalska',specialty:'Masaż klasyczny i relaksacyjny',days:[1,2,3,4,5],from:'09:00',to:'17:00',breakFrom:'13:00',breakTo:'13:30',off:[]},
 {id:'e2',name:'Michał Nowak',specialty:'Aromaterapia i masaż kamieniami',days:[1,2,3,4,5,6],from:'10:00',to:'18:00',breakFrom:'14:00',breakTo:'14:30',off:[]},
 {id:'e3',name:'Julia Wiśniewska',specialty:'Masaż sportowy',days:[1,2,3,4,5],from:'08:00',to:'16:00',breakFrom:'12:00',breakTo:'12:30',off:[]}],
 rooms:[{id:'r1',name:'Gabinet Natura',description:'Relaks i masaż klasyczny',closed:[]},{id:'r2',name:'Gabinet Balance',description:'Masaże klasyczne i sportowe',closed:[]},{id:'r3',name:'Gabinet Zen',description:'Aromaterapia i gorące kamienie',closed:[]}],
 clients:[{id:'c1',name:'Katarzyna Zielińska',email:'katarzyna@example.com',phone:'500100200'}],
 bookings:[],vouchers:[{code:'SPA50',amount:50,status:'active',bookingId:null},{code:'RELAX100',amount:100,status:'active',bookingId:null},{code:'HOTEL80',amount:80,status:'active',bookingId:null}],settlements:[]};}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.services)&&Array.isArray(x.bookings))return x}catch(_){}return seed()}
let db=load(),page='dashboard',chosen='',apiResult={message:'Uruchom symulację.'},toastTimer;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}save();
const by=(list,id)=>db[list].find(x=>x.id===id);
const sname=id=>by('services',id)?.name||'Usługa usunięta';
const ename=id=>by('employees',id)?.name||'Nieznany';
const rname=id=>by('rooms',id)?.name||'Nieznany';
const cname=id=>by('clients',id)?.name||'Nieznany';
function notify(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalLayer').classList.remove('hidden')}
function closeModal(){$('modalLayer').classList.add('hidden')}
$('modalLayer').addEventListener('click',e=>{if(e.target.id==='modalLayer')closeModal()});
const titles={dashboard:'Pulpit',services:'Oferta usług',booking:'Nowa rezerwacja',reservations:'Rezerwacje',employees:'Pracownicy',rooms:'Gabinety',clients:'Klienci',reports:'Raporty',integrations:'Integracje API'};
function navigate(p){page=p;chosen='';$('pageTitle').textContent=titles[p];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo(0,0)}
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page)});
function render(){const pages={dashboard,services,booking,reservations,employees,rooms,clients,reports,integrations};$('app').innerHTML=pages[page]()}
const empty=s=>`<div class="empty">${esc(s)}</div>`;
const metric=(name,val)=>`<div class="card"><small>${esc(name)}</small><div class="metric">${esc(val)}</div></div>`;
const stateTag=s=>`<span class="tag ${s==='cancelled'?'bad':s==='completed'?'':'blue'}">${{confirmed:'Potwierdzona',completed:'Zrealizowana',cancelled:'Anulowana'}[s]||s}</span>`;
// Sprawdzenie dopasowania całego interwału masażu.
function check(serviceId,employeeId,roomId,date,time,exclude=null){
 const s=by('services',serviceId),e=by('employees',employeeId),r=by('rooms',roomId);
 if(!s||!e||!r||!date||!time)return {ok:false,reason:'Brak kompletnych danych terminu.'};
 if(!s.therapists.includes(employeeId))return {ok:false,reason:'Masażysta nie świadczy tej usługi.'};
 if(!s.rooms.includes(roomId))return {ok:false,reason:'Gabinet nie obsługuje tej usługi.'};
 const day=new Date(date+'T12:00:00').getDay();
 if(!e.days.includes(day)||e.off.includes(date))return {ok:false,reason:'Dzień wolny masażysty.'};
 if(r.closed.includes(date))return {ok:false,reason:'Gabinet niedostępny w tym dniu.'};
 const a=mins(time),b=a+Number(s.duration);
 if(new Date(date+'T'+time+':00')<=new Date())return {ok:false,reason:'Termin już minął.'};
 if(a<mins(e.from)||b>mins(e.to))return {ok:false,reason:'Poza godzinami pracy masażysty.'};
 if(e.breakFrom&&e.breakTo&&intersect(a,b,mins(e.breakFrom),mins(e.breakTo)))return {ok:false,reason:'Przerwa masażysty.'};
 for(const old of db.bookings){if(old.id===exclude||old.status==='cancelled'||old.date!==date)continue;
 const x=mins(old.time),y=x+Number(old.duration||by('services',old.serviceId)?.duration||60);
 if(intersect(a,b,x,y)&&old.employeeId===employeeId)return {ok:false,reason:'Masażysta ma już wizytę.'};
 if(intersect(a,b,x,y)&&old.roomId===roomId)return {ok:false,reason:'Gabinet jest zajęty.'};}
 return {ok:true,reason:'Termin dostępny.'};
}
function slots(s,e,r,date,exclude){const a=[];for(let m=480;m<=1200;m+=30){const time=clock(m);a.push({time,...check(s,e,r,date,time,exclude)})}return a}
function createBooking(x){const availability=check(x.serviceId,x.employeeId,x.roomId,x.date,x.time);
 if(!availability.ok)return {success:false,error:availability.reason,code:'SLOT_CONFLICT'};
 if(!String(x.name||'').trim()||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(x.email||'')))return {success:false,error:'Podaj imię i poprawny e-mail.',code:'INVALID_CLIENT'};
 const s=by('services',x.serviceId),code=String(x.voucher||'').trim().toUpperCase();let v=null,discount=0;
 if(code){v=db.vouchers.find(z=>z.code===code);if(!v||v.status!=='active')return {success:false,error:'Voucher nieaktywny lub nieznany.',code:'INVALID_VOUCHER'};discount=Math.min(v.amount,s.price)}
 const email=String(x.email).trim().toLowerCase();let c=db.clients.find(z=>z.email.toLowerCase()===email);
 if(!c){c={id:uid(),name:String(x.name).trim(),email,phone:x.phone||''};db.clients.push(c)}
 const b={id:uid(),serviceId:x.serviceId,employeeId:x.employeeId,roomId:x.roomId,date:x.date,time:x.time,duration:s.duration,price:s.price,discount,total:s.price-discount,clientId:c.id,status:'confirmed',source:x.source||'SPA',voucher:code||null,createdAt:new Date().toISOString()};db.bookings.push(b);
 if(v){v.status='used';v.bookingId=b.id;db.settlements.push({id:uid(),bookingId:b.id,code,amount:discount,status:'Rozliczony (demo)',date:dateISO(new Date())})}
 save();return {success:true,booking:b};}
function dashboard(){const active=db.bookings.filter(b=>b.status==='confirmed');const completed=db.bookings.filter(b=>b.status==='completed');const upcoming=[...active].filter(b=>new Date(b.date+'T'+b.time)>=new Date()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,7);
 return `<p class="muted">Podsumowanie działania salonu i szybki dostęp do modułów.</p><div class="grid four">${metric('Wizyty dzisiaj',db.bookings.filter(b=>b.date===dateISO(new Date())&&b.status!=='cancelled').length)}${metric('Aktywne rezerwacje',active.length)}${metric('Klienci',db.clients.length)}${metric('Przychód z wizyt',fmt(completed.reduce((a,b)=>a+b.total,0)))}</div><div class="grid two section"><div class="card"><div class="row between"><h2>Nadchodzące wizyty</h2><button class="btn secondary small" onclick="navigate('reservations')">Wszystkie</button></div>${upcoming.length?upcoming.map(b=>`<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--line)"><div><b>${esc(b.date)} ${esc(b.time)}</b><br>${esc(sname(b.serviceId))}<br><small>${esc(cname(b.clientId))}</small></div>${stateTag(b.status)}</div>`).join(''):empty('Brak nadchodzących wizyt.')}</div><div class="card"><h2>Szybkie działania</h2><p>Utwórz rezerwację albo zarządzaj personelem, gabinetami oraz integracjami.</p><div class="stack"><button class="btn" onclick="navigate('booking')">+ Utwórz rezerwację</button><button class="btn secondary" onclick="navigate('employees')">Grafik pracowników</button><button class="btn secondary" onclick="navigate('rooms')">Dostępność gabinetów</button><button class="btn secondary" onclick="navigate('integrations')">Integracje B, C i D</button></div></div></div>`;}
function services(){return `<div class="row between" style="margin-bottom:16px"><p class="muted">Oferta, ceny, czas trwania i powiązane zasoby.</p><button class="btn" onclick="addService()">+ Dodaj usługę</button></div><div class="grid three">${db.services.map(s=>`<div class="card service"><div class="symbol">${esc(s.icon)}</div><h3>${esc(s.name)}</h3><p class="muted">${esc(s.description)}</p><small>${s.duration} min · ${s.therapists.length} masażystów · ${s.rooms.length} gabinetów</small><div class="row between"><div class="price">${fmt(s.price)}</div><button class="btn small" onclick="serviceBooking('${s.id}')">Rezerwuj</button></div></div>`).join('')}</div>`}
function addService(){openModal('Nowa usługa',`<form id="serviceForm" class="stack"><label class="field">Nazwa<input name="name" required maxlength="100"></label><div class="grid two"><label class="field">Cena (PLN)<input type="number" name="price" min="0" required></label><label class="field">Czas (min)<input type="number" name="duration" min="15" max="240" step="15" required></label></div><label class="field">Opis<textarea name="description"></textarea></label><label class="field">Masażyści (wybór wielokrotny)<select id="serviceStaff" multiple required size="4">${db.employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></label><label class="field">Gabinety (wybór wielokrotny)<select id="serviceRooms" multiple required size="3">${db.rooms.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></label><button class="btn" type="submit">Dodaj usługę</button></form>`);
 $('serviceForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),therapists=[...$('serviceStaff').selectedOptions].map(x=>x.value),rooms=[...$('serviceRooms').selectedOptions].map(x=>x.value);if(!therapists.length||!rooms.length)return notify('Wskaż masażystę i gabinet.');db.services.push({id:uid(),name:f.get('name').trim(),duration:Number(f.get('duration')),price:Number(f.get('price')),description:f.get('description'),icon:'🌿',therapists,rooms});save();closeModal();render();notify('Dodano usługę.')};}
function serviceBooking(id){navigate('booking');$('bService').value=id;changeService()}
function booking(){return `<p class="muted">Terminy uwzględniają czas trwania zabiegu, grafik masażysty, przerwy, dni wolne i zajętość gabinetu.</p><div class="grid two"><div class="card stack"><h2>1. Wybierz usługę i zasoby</h2><label class="field">Usługa<select id="bService" onchange="changeService()">${selectOptions(db.services)}</select></label><label class="field">Masażysta<select id="bEmployee" onchange="changeResources()"><option value="">Wybierz usługę</option></select></label><label class="field">Gabinet<select id="bRoom" onchange="changeResources()"><option value="">Wybierz usługę</option></select></label><label class="field">Data wizyty<input id="bDate" type="date" min="${addDay(0)}" value="${addDay(1)}" onchange="changeResources()"></label><div class="info">Wybierz wszystkie parametry, aby sprawdzić wolne terminy.</div></div><div class="card"><h2>2. Wybierz godzinę</h2><div id="slotArea">${empty('Najpierw wybierz usługę, masażystę i gabinet.')}</div></div></div><div class="grid two section"><div class="card stack"><h2>3. Dane klienta</h2><label class="field">Imię i nazwisko<input id="bName" maxlength="100" placeholder="Jan Kowalski"></label><label class="field">E-mail<input id="bEmail" type="email" placeholder="jan@example.com"></label><label class="field">Telefon<input id="bPhone" type="tel" placeholder="500 100 200"></label><label class="field">Kod vouchera (opcjonalnie)<input id="bVoucher" placeholder="SPA50" oninput="updateSummary()"></label></div><div class="card stack"><h2>4. Podsumowanie i potwierdzenie</h2><div id="summaryArea"></div><div class="error hidden" id="bookingError" role="alert"></div><button class="btn full" onclick="submitBooking()">Potwierdź rezerwację</button></div></div>`}
function changeService(){const s=by('services',$('bService').value);$('bEmployee').innerHTML=selectOptions(s?db.employees.filter(e=>s.therapists.includes(e.id)):[]);$('bRoom').innerHTML=selectOptions(s?db.rooms.filter(r=>s.rooms.includes(r.id)):[]);changeResources()}
function changeResources(){chosen='';const s=$('bService').value,e=$('bEmployee').value,r=$('bRoom').value,d=$('bDate').value;if(!s||!e||!r||!d){$('slotArea').innerHTML=empty('Uzupełnij wybór usługi, masażysty, gabinetu i daty.');updateSummary();return}const list=slots(s,e,r,d);$('slotArea').innerHTML=`<div class="slots">${list.map(t=>`<button class="slot" ${!t.ok?'disabled':''} title="${esc(t.reason)}" onclick="chooseSlot('${t.time}')">${t.time}</button>`).join('')}</div><p class="hint" style="margin-top:15px">Dostępne: ${list.filter(t=>t.ok).length}. Przekreślone godziny są niedostępne.</p>`;updateSummary()}
function chooseSlot(time){chosen=time;document.querySelectorAll('.slot').forEach(b=>b.classList.toggle('selected',b.textContent===time));updateSummary()}
function updateSummary(){const s=by('services',$('bService').value),v=db.vouchers.find(x=>x.code===($('bVoucher').value||'').trim().toUpperCase()&&x.status==='active'),discount=s&&v?Math.min(s.price,v.amount):0;$('summaryArea').innerHTML=`<div class="stack"><div class="row between"><span>Usługa</span><strong>${esc(s?.name||'—')}</strong></div><div class="row between"><span>Masażysta</span><strong>${esc(ename($('bEmployee').value)||'—')}</strong></div><div class="row between"><span>Gabinet</span><strong>${esc(rname($('bRoom').value)||'—')}</strong></div><div class="row between"><span>Data</span><strong>${esc($('bDate').value)}</strong></div><div class="row between"><span>Godzina</span><strong>${chosen||'—'}</strong></div><div class="divider"></div><div class="row between"><span>Voucher</span><strong>-${fmt(discount)}</strong></div><div class="row between"><b>Do zapłaty</b><strong class="price">${fmt(s?s.price-discount:0)}</strong></div></div>`}
function submitBooking(){const error=$('bookingError');error.classList.add('hidden');if(!chosen){error.textContent='Wybierz wolną godzinę.';error.classList.remove('hidden');return}const result=createBooking({serviceId:$('bService').value,employeeId:$('bEmployee').value,roomId:$('bRoom').value,date:$('bDate').value,time:chosen,name:$('bName').value,email:$('bEmail').value,phone:$('bPhone').value,voucher:$('bVoucher').value,source:'SPA'});if(!result.success){error.textContent=result.error+' Wybierz inny termin lub popraw dane.';error.classList.remove('hidden');if(result.code==='SLOT_CONFLICT')changeResources();return}const b=result.booking;openModal('✓ Rezerwacja potwierdzona',`<div class="good"><h3>${esc(sname(b.serviceId))}</h3>Data: <strong>${esc(b.date)}</strong><br>Godzina: <strong>${esc(b.time)}</strong><br>Masażysta: ${esc(ename(b.employeeId))}<br>Gabinet: ${esc(rname(b.roomId))}<br>Kwota: ${fmt(b.total)}</div><p class="hint" style="margin:13px 0">ID: ${esc(b.id)}</p><button class="btn full" onclick="closeModal();navigate('reservations')">Zobacz rezerwacje</button>`);notify('Zapisano rezerwację.')}
function reservations(){const all=[...db.bookings].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));return `<div class="row between" style="margin-bottom:15px"><p class="muted">Tworzenie, przekładanie i anulowanie wizyt z kontrolą konfliktów.</p><button class="btn" onclick="navigate('booking')">+ Nowa rezerwacja</button></div><div class="card">${all.length?`<div class="tablewrap"><table><thead><tr><th>Termin</th><th>Usługa / klient</th><th>Masażysta / gabinet</th><th>Status</th><th>Kwota</th><th>Akcje</th></tr></thead><tbody>${all.map(b=>`<tr><td><b>${esc(b.date)}</b><br>${esc(b.time)}</td><td>${esc(sname(b.serviceId))}<br><small>${esc(cname(b.clientId))} · ${esc(b.source)}</small></td><td>${esc(ename(b.employeeId))}<br><small>${esc(rname(b.roomId))}</small></td><td>${stateTag(b.status)}</td><td>${fmt(b.total)}</td><td>${b.status==='confirmed'?`<div class="row"><button class="btn secondary small" onclick="editBooking('${b.id}')">Przełóż</button><button class="btn secondary small" onclick="complete('${b.id}')">Zrealizuj</button><button class="btn danger small" onclick="cancel('${b.id}')">Anuluj</button></div>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:empty('Nie ma jeszcze żadnych rezerwacji.')}</div>`}
function complete(id){const b=by('bookings',id);if(!b||b.status!=='confirmed')return;b.status='completed';save();render();notify('Wizyta oznaczona jako zrealizowana.')}
function cancel(id){const b=by('bookings',id);if(!b||b.status!=='confirmed'||!confirm('Anulować rezerwację?'))return;b.status='cancelled';if(b.voucher){const v=db.vouchers.find(x=>x.code===b.voucher&&x.bookingId===b.id);if(v){v.status='active';v.bookingId=null}db.settlements=db.settlements.filter(x=>x.bookingId!==b.id)}save();render();notify('Rezerwacja anulowana.')}
function editBooking(id){const b=by('bookings',id),s=by('services',b.serviceId);openModal('Przełóż wizytę',`<div class="stack"><p><b>${esc(s.name)}</b> — ${esc(cname(b.clientId))}</p><label class="field">Nowa data<input id="editDate" type="date" min="${addDay(0)}" value="${b.date}" onchange="changeEdit('${id}')"></label><label class="field">Masażysta<select id="editEmployee" onchange="changeEdit('${id}')">${selectOptions(db.employees.filter(e=>s.therapists.includes(e.id)),'Wybierz',b.employeeId)}</select></label><label class="field">Gabinet<select id="editRoom" onchange="changeEdit('${id}')">${selectOptions(db.rooms.filter(r=>s.rooms.includes(r.id)),'Wybierz',b.roomId)}</select></label><label class="field">Nowa godzina<select id="editTime"></select></label><button class="btn" onclick="saveEdit('${id}')">Zapisz zmianę</button></div>`);changeEdit(id)}
function changeEdit(id){const b=by('bookings',id),a=slots(b.serviceId,$('editEmployee').value,$('editRoom').value,$('editDate').value,id).filter(x=>x.ok);$('editTime').innerHTML='<option value="">Wybierz godzinę</option>'+a.map(x=>`<option value="${x.time}" ${x.time===b.time&&$('editDate').value===b.date?'selected':''}>${x.time}</option>`).join('')}
function saveEdit(id){const b=by('bookings',id),date=$('editDate').value,employeeId=$('editEmployee').value,roomId=$('editRoom').value,time=$('editTime').value,c=check(b.serviceId,employeeId,roomId,date,time,id);if(!c.ok)return notify('Nie można zapisać: '+c.reason);Object.assign(b,{date,employeeId,roomId,time});save();closeModal();render();notify('Termin zmieniony.')}
function employees(){return `<div class="row between" style="margin-bottom:15px"><p class="muted">Grafiki, przerwy i dni wolne masażystów.</p><button class="btn" onclick="addEmployee()">+ Dodaj pracownika</button></div><div class="grid three">${db.employees.map(e=>`<div class="card"><h3>${esc(e.name)}</h3><p class="muted">${esc(e.specialty)}</p><p><b>Praca:</b> ${esc(e.from)}–${esc(e.to)}<br><b>Przerwa:</b> ${esc(e.breakFrom)}–${esc(e.breakTo)}<br><b>Dni tygodnia:</b> ${e.days.map(x=>['Nd','Pn','Wt','Śr','Cz','Pt','Sb'][x]).join(', ')}<br><b>Dni wolne:</b> ${e.off.length}</p><button class="btn secondary full" onclick="editEmployee('${e.id}')">Edytuj grafik</button></div>`).join('')}</div>`}
function editEmployee(id){const e=by('employees',id);openModal('Grafik: '+e.name,`<form id="scheduleForm" class="stack"><div class="grid two"><label class="field">Praca od<input name="from" type="time" required value="${e.from}"></label><label class="field">Praca do<input name="to" type="time" required value="${e.to}"></label><label class="field">Przerwa od<input name="breakFrom" type="time" required value="${e.breakFrom}"></label><label class="field">Przerwa do<input name="breakTo" type="time" required value="${e.breakTo}"></label></div><label class="field">Dni pracy (możliwy wybór kilku)<select id="days" multiple size="7">${[1,2,3,4,5,6,0].map(i=>`<option value="${i}" ${e.days.includes(i)?'selected':''}>${['Niedziela','Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota'][i]}</option>`).join('')}</select></label><label class="field">Dodaj dzień wolny<input id="offDate" type="date" min="${addDay(0)}"></label><p class="hint">Dni wolne: ${e.off.map(esc).join(', ')||'brak'}</p><button class="btn" type="submit">Zapisz grafik</button></form>`);$('scheduleForm').onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.target),from=f.get('from'),to=f.get('to'),breakFrom=f.get('breakFrom'),breakTo=f.get('breakTo'),days=[...$('days').selectedOptions].map(o=>Number(o.value));if(!days.length||mins(from)>=mins(to)||mins(breakFrom)>=mins(breakTo)||mins(breakFrom)<mins(from)||mins(breakTo)>mins(to))return notify('Błędne godziny lub dni pracy.');Object.assign(e,{from,to,breakFrom,breakTo,days});if($('offDate').value&&!e.off.includes($('offDate').value))e.off.push($('offDate').value);save();closeModal();render();notify('Grafik zaktualizowany.')};}
function addEmployee(){openModal('Dodaj masażystę',`<form id="employeeForm" class="stack"><label class="field">Imię i nazwisko<input name="name" required></label><label class="field">Specjalizacja<input name="specialty" required></label><button class="btn">Dodaj</button></form>`);$('employeeForm').onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.target);db.employees.push({id:uid(),name:f.get('name'),specialty:f.get('specialty'),days:[1,2,3,4,5],from:'09:00',to:'17:00',breakFrom:'13:00',breakTo:'13:30',off:[]});save();closeModal();render();notify('Dodano masażystę. Przypisz go do nowej usługi.')};}
function rooms(){return `<div class="row between" style="margin-bottom:15px"><p class="muted">Pomieszczenia i wyłączenia dostępności.</p><button class="btn" onclick="addRoom()">+ Dodaj gabinet</button></div><div class="grid three">${db.rooms.map(r=>`<div class="card"><div style="font-size:30px">⌂</div><h3>${esc(r.name)}</h3><p class="muted">${esc(r.description)}</p><p>Usługi: ${db.services.filter(s=>s.rooms.includes(r.id)).length}<br>Dni zablokowane: ${r.closed.length}</p><button class="btn secondary full" onclick="roomDays('${r.id}')">Zarządzaj dostępnością</button></div>`).join('')}</div>`}
function roomDays(id){const r=by('rooms',id);openModal('Dostępność: '+r.name,`<div class="stack"><label class="field">Wyłącz gabinet w dniu<input id="closedDate" type="date" min="${addDay(0)}"></label><button class="btn" onclick="blockRoom('${id}')">Zablokuj ten dzień</button><h3>Dni zablokowane</h3>${r.closed.length?r.closed.map(d=>`<div class="row between"><span>${esc(d)}</span><button class="btn danger small" onclick="unblockRoom('${id}','${d}')">Odblokuj</button></div>`).join(''):empty('Brak wyłączeń.')}</div>`)}
function blockRoom(id){const v=$('closedDate').value;if(!v)return notify('Wskaż datę.');const r=by('rooms',id);if(!r.closed.includes(v))r.closed.push(v);save();roomDays(id);render();notify('Gabinet zablokowany.')}
function unblockRoom(id,d){const r=by('rooms',id);r.closed=r.closed.filter(x=>x!==d);save();roomDays(id);render();notify('Gabinet odblokowany.')}
function addRoom(){openModal('Nowy gabinet',`<form id="roomForm" class="stack"><label class="field">Nazwa<input name="name" required></label><label class="field">Opis<input name="description"></label><button class="btn">Dodaj</button></form>`);$('roomForm').onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.target);db.rooms.push({id:uid(),name:f.get('name'),description:f.get('description'),closed:[]});save();closeModal();render();notify('Dodano gabinet. Przypisz go do nowej usługi.')};}
function clients(){return `<p class="muted">Kartoteki klientów i historia usług.</p><div class="card">${db.clients.length?`<div class="tablewrap"><table><thead><tr><th>Klient</th><th>Kontakt</th><th>Wizyty</th><th>Przychód</th><th>Historia</th></tr></thead><tbody>${db.clients.map(c=>{const b=db.bookings.filter(x=>x.clientId===c.id);return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.email)}<br>${esc(c.phone)}</td><td>${b.length}</td><td>${fmt(b.filter(x=>x.status==='completed').reduce((a,x)=>a+x.total,0))}</td><td><button class="btn secondary small" onclick="history('${c.id}')">Pokaż</button></td></tr>`}).join('')}</tbody></table></div>`:empty('Brak klientów.')}</div>`}
function history(id){const c=by('clients',id),list=db.bookings.filter(b=>b.clientId===id);openModal('Historia: '+c.name,`<p>${esc(c.email)} · ${esc(c.phone)}</p>${list.length?list.map(b=>`<div class="divider"></div><div><strong>${esc(b.date)} ${esc(b.time)} — ${esc(sname(b.serviceId))}</strong><p>${stateTag(b.status)} · ${fmt(b.total)} · ${esc(ename(b.employeeId))}</p></div>`).join(''):empty('Brak wizyt.')}`)}
function reports(){const completed=db.bookings.filter(b=>b.status==='completed'),revenue=completed.reduce((n,b)=>n+b.total,0),max=Math.max(1,...db.services.map(s=>db.bookings.filter(b=>b.serviceId===s.id&&b.status!=='cancelled').length));return `<p class="muted">Zestawienia liczby wizyt, czasu pracy i zrealizowanych przychodów.</p><div class="grid four">${metric('Wszystkie rezerwacje',db.bookings.length)}${metric('Zrealizowane',completed.length)}${metric('Przychody',fmt(revenue))}${metric('Godziny pracy',(completed.reduce((n,b)=>n+b.duration,0)/60).toFixed(1)+' h')}</div><div class="grid two section"><div class="card"><h2>Popularność usług</h2>${db.services.map(s=>{const count=db.bookings.filter(b=>b.serviceId===s.id&&b.status!=='cancelled').length;return `<div class="chartrow"><small>${esc(s.name)}</small><div class="bar"><b style="width:${100*count/max}%"></b></div><b>${count}</b></div>`}).join('')}</div><div class="card"><h2>Źródła rezerwacji</h2>${['SPA','Projekt B - Fitness','Projekt C - Hotel'].map(src=>`<div class="row between" style="padding:10px 0"><span>${esc(src)}</span><b>${db.bookings.filter(b=>b.source===src).length}</b></div>`).join('')}<div class="divider"></div><h3>Vouchery rozliczone (demo)</h3><p>${db.settlements.length} szt. · ${fmt(db.settlements.reduce((n,x)=>n+x.amount,0))}</p></div></div><div class="card section"><h2>Praca masażystów</h2><div class="tablewrap"><table><thead><tr><th>Masażysta</th><th>Zrealizowane</th><th>Czas</th><th>Przychód</th></tr></thead><tbody>${db.employees.map(e=>{const list=completed.filter(b=>b.employeeId===e.id);return `<tr><td>${esc(e.name)}</td><td>${list.length}</td><td>${(list.reduce((n,b)=>n+b.duration,0)/60).toFixed(1)} h</td><td>${fmt(list.reduce((n,b)=>n+b.total,0))}</td></tr>`}).join('')}</tbody></table></div></div>`}
function integrations(){return `<p class="muted">Symulator komunikacji z Projektami B (fitness), C (hotel) i D (vouchery). Wszystkie operacje wykonują się lokalnie.</p><div class="grid three"><div class="card stack"><span class="tag">Projekt B</span><h3>Fitness i treningi</h3><p>Partner przegląda ofertę i tworzy rezerwacje masaży.</p><button class="btn secondary" onclick="partner('B')">Symuluj rezerwację</button></div><div class="card stack"><span class="tag blue">Projekt C</span><h3>System hotelowy</h3><p>Hotel rezerwuje masaż dla gościa w dostępnym terminie.</p><button class="btn secondary" onclick="partner('C')">Symuluj rezerwację</button></div><div class="card stack"><span class="tag warn">Projekt D</span><h3>Vouchery</h3><p>Weryfikacja kodu, realizacja i rozliczenia testowe.</p><button class="btn secondary" onclick="partner('D')">Sprawdź voucher</button></div></div><div class="grid two section"><div class="card stack"><h2>Symulator API</h2><label class="field">Operacja<select id="endpoint" onchange="apiFields()"><option value="services">GET /api/services</option><option value="employees">GET /api/employees</option><option value="rooms">GET /api/rooms</option><option value="availability">GET /api/availability</option><option value="reservations">GET /api/reservations</option><option value="voucher">POST /api/vouchers/validate</option><option value="settlements">GET /api/vouchers/settlements</option></select></label><div id="apiFields"></div><button class="btn" onclick="runApi()">Uruchom symulację</button></div><div class="card"><h2>Odpowiedź JSON</h2><pre id="apiResult" class="code">${esc(JSON.stringify(apiResult,null,2))}</pre><button class="btn outline small" onclick="copyApi()">Kopiuj JSON</button></div></div><div class="grid two section"><div class="card"><h2>Vouchery testowe</h2><div class="tablewrap"><table><thead><tr><th>Kod</th><th>Wartość</th><th>Status</th></tr></thead><tbody>${db.vouchers.map(v=>`<tr><td>${esc(v.code)}</td><td>${fmt(v.amount)}</td><td>${v.status==='active'?'<span class="tag">Aktywny</span>':'<span class="tag bad">Wykorzystany</span>'}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><h2>Rozliczenia voucherów</h2>${db.settlements.length?db.settlements.map(x=>`<p><b>${esc(x.code)}</b> · ${fmt(x.amount)} · ${esc(x.date)}<br><small>${esc(x.status)}</small></p>`).join(''):empty('Brak rozliczeń.')}</div></div><p class="hint section">Endpointy mają charakter poglądowy i wymagają uzgodnienia z zespołami partnerskimi. Symulacja nie wykonuje żądań HTTP.</p>`}
function partner(p){if(p==='D'){apiResult={request:{method:'POST',path:'/api/vouchers/validate',code:'SPA50'},response:voucherStatus('SPA50')};render();return}const s=p==='B'?db.services.find(x=>x.id==='s3'):db.services[0];let found=null;for(let n=1;n<=30&&!found;n++){for(const e of s.therapists){for(const r of s.rooms){const slot=slots(s.id,e,r,addDay(n)).find(x=>x.ok);if(slot){found={serviceId:s.id,employeeId:e,roomId:r,date:addDay(n),time:slot.time};break}}if(found)break}}if(!found){apiResult={status:409,error:'Brak wolnych terminów'};render();return}const result=createBooking({...found,name:p==='B'?'Klient Fitness Demo':'Gość Hotelowy Demo',email:p==='B'?'fitness.demo@example.com':'hotel.demo@example.com',source:p==='B'?'Projekt B - Fitness':'Projekt C - Hotel'});apiResult={request:{method:'POST',path:'/api/reservations',partner:'Projekt '+p,...found},status:result.success?201:409,response:result.success?{success:true,bookingId:result.booking.id,date:found.date,time:found.time}:result};render();notify('Symulacja Projektu '+p+' zakończona.')}
function voucherStatus(code){const v=db.vouchers.find(x=>x.code===code);return {code,valid:!!v&&v.status==='active',amount:v&&v.status==='active'?v.amount:0,status:v?.status||'not_found'}}
function apiFields(){const type=$('endpoint').value;if(type==='voucher')$('apiFields').innerHTML='<label class="field">Kod vouchera<input id="apiVoucher" value="SPA50"></label>';else if(type==='availability')$('apiFields').innerHTML=`<div class="stack"><label class="field">Usługa<select id="apiService" onchange="apiServiceChange()">${selectOptions(db.services)}</select></label><label class="field">Masażysta<select id="apiEmployee"></select></label><label class="field">Gabinet<select id="apiRoom"></select></label><label class="field">Data<input id="apiDate" type="date" value="${addDay(1)}"></label></div>`;else $('apiFields').innerHTML='<div class="info">Brak dodatkowych parametrów.</div>'}
function apiServiceChange(){const s=by('services',$('apiService').value);$('apiEmployee').innerHTML=selectOptions(s?db.employees.filter(e=>s.therapists.includes(e.id)):[]);$('apiRoom').innerHTML=selectOptions(s?db.rooms.filter(r=>s.rooms.includes(r.id)):[])}
function runApi(){const type=$('endpoint').value;let data;if(type==='services')data=db.services;if(type==='employees')data=db.employees;if(type==='rooms')data=db.rooms;if(type==='reservations')data=db.bookings;if(type==='settlements')data=db.settlements;if(type==='voucher')data=voucherStatus(($('apiVoucher').value||'').trim().toUpperCase());if(type==='availability'){const s=$('apiService').value,e=$('apiEmployee').value,r=$('apiRoom').value,d=$('apiDate').value;data={serviceId:s,employeeId:e,roomId:r,date:d,freeHours:s&&e&&r&&d?slots(s,e,r,d).filter(x=>x.ok).map(x=>x.time):[]}}apiResult={status:200,success:true,data};$('apiResult').textContent=JSON.stringify(apiResult,null,2)}
function copyApi(){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(JSON.stringify(apiResult,null,2)).then(()=>notify('Skopiowano JSON.')).catch(()=>notify('Schowek niedostępny.'));else notify('Schowek niedostępny.')}
render();
</script>
</body>
</html>
